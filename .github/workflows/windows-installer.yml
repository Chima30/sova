name: Installers

# Builds SOVA-Setup.exe (Windows) and SOVA-<version>-mac-arm64.dmg (macOS,
# Apple Silicon) on every push to main and uploads them as workflow artifacts
# only. Nothing is published automatically. To publish a GitHub Release with
# both, run this workflow by hand (Actions tab, Run workflow) with "publish"
# ticked, once John has approved the version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release for the version in package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Check the SDK runtime is bundled
        shell: pwsh
        run: |
          $res = Get-ChildItem release/win-unpacked/resources/smartspectra
          $res | Format-Table Name, Length
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/smartspectra_capi.dll)) { throw 'smartspectra_capi.dll missing from the package' }
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/graph)) { throw 'SDK graph folder missing from the package' }

      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-Setup
          path: release/SOVA-Setup-*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # No Apple Developer certificate yet: sign ad hoc so the app runs on
      # Apple Silicon. People open it the first time with right-click › Open.
      - name: Build disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --mac --arm64 --publish never -c.mac.identity=-

      - name: Check the SDK runtime is bundled and the app is signed
        run: |
          APP="$(ls -d release/mac-arm64/*.app | head -1)"
          ls -la "$APP/Contents/Resources/smartspectra"
          test -f "$APP/Contents/Resources/smartspectra/libsmartspectra_capi.dylib" || { echo 'libsmartspectra_capi.dylib missing'; exit 1; }
          test -d "$APP/Contents/Resources/smartspectra/graph" || { echo 'SDK graph folder missing'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q 'device.camera' || { echo 'camera entitlement missing'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-mac
          path: release/SOVA-*-mac-arm64.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists, nothing to publish."; exit 0; fi
          gh release create "$tag" out/SOVA-Setup/*.exe out/SOVA-mac/*.dmg --target "$GITHUB_SHA" --title "SOVA $tag" --notes-file RELEASE_NOTES.md
