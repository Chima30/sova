name: Windows installer

# Builds SOVA-Setup.exe on a Windows machine on every push to main.
# - The installer is always uploaded as a workflow artifact.
# - If package.json has a version with no release yet (for example 0.3.0 and
#   no v0.3.0 release), a GitHub Release is published with the installer.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Check the SDK runtime is bundled
        shell: pwsh
        run: |
          $res = Get-ChildItem release/win-unpacked/resources/smartspectra
          $res | Format-Table Name, Length
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/smartspectra_capi.dll)) { throw 'smartspectra_capi.dll missing from the package' }
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/graph)) { throw 'SDK graph folder missing from the package' }

      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-Setup
          path: release/SOVA-Setup-*.exe
          if-no-files-found: error

      - name: Publish release for a new version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists, nothing to publish."; exit 0 }
          $exe = Get-ChildItem release/SOVA-Setup-*.exe | Select-Object -First 1
          gh release create $tag $exe.FullName --target $env:GITHUB_SHA --title "SOVA $tag" --notes-file RELEASE_NOTES.md
