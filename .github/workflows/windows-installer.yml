name: Windows installer

# Builds SOVA-Setup.exe on a Windows machine.
# - Every push to main: installer available as a workflow artifact.
# - A version tag (v*): installer attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Check the SDK runtime is bundled
        shell: pwsh
        run: |
          $res = Get-ChildItem release/win-unpacked/resources/smartspectra
          $res | Format-Table Name, Length
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/smartspectra_capi.dll)) { throw 'smartspectra_capi.dll missing from the package' }
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/graph)) { throw 'SDK graph folder missing from the package' }

      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-Setup
          path: release/SOVA-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem release/SOVA-Setup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $exe.FullName --title "SOVA ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
