name: Windows installer

# Builds SOVA-Setup.exe on a Windows machine on every push to main and
# uploads it as a workflow artifact only. Nothing is published automatically.
# To publish a GitHub Release, run this workflow by hand (Actions tab, Run
# workflow) with "publish" ticked, once John has approved the version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release for the version in package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Check the SDK runtime is bundled
        shell: pwsh
        run: |
          $res = Get-ChildItem release/win-unpacked/resources/smartspectra
          $res | Format-Table Name, Length
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/smartspectra_capi.dll)) { throw 'smartspectra_capi.dll missing from the package' }
          if (-not (Test-Path release/win-unpacked/resources/smartspectra/graph)) { throw 'SDK graph folder missing from the package' }

      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-Setup
          path: release/SOVA-Setup-*.exe
          if-no-files-found: error

      - name: Publish release (manual runs only, when approved)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists, nothing to publish."; exit 0 }
          $exe = Get-ChildItem release/SOVA-Setup-*.exe | Select-Object -First 1
          gh release create $tag $exe.FullName --target $env:GITHUB_SHA --title "SOVA $tag" --notes-file RELEASE_NOTES.md
