<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
  <title>SOVA widget</title>
  <style>
    @font-face { font-family: "Geist"; src: url("./fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("./fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
    * { box-sizing: border-box; }
    :root { --bg: #12102a; --card: #1d1a3c; --hair: rgba(236, 232, 255, 0.15); --text: #f4f1fb; --text-2: #bab5d7; --muted: #8e89b0; --accent: #6fd8c6; --btn: #2a2652; --btn-2: #36315f; --primary: #f4f1fb; --primary-ink: #17142f; }
    [data-theme="light"] { --bg: #f4f1fa; --card: #ffffff; --hair: rgba(44, 36, 96, 0.15); --text: #221e45; --text-2: #565280; --muted: #7f7ba0; --accent: #14907f; --btn: #f1edfb; --btn-2: #e6e0f6; --primary: #2b2564; --primary-ink: #ffffff; }
    html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font-family: "Geist", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
    .card { height: 100%; border: 1px solid var(--hair); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; -webkit-app-region: drag; background: var(--card); }
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; height: 18px; }
    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); }
    .brand svg { color: var(--accent); }
    .cam { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.warn { background: var(--muted); box-shadow: none; }
    .mid { display: flex; align-items: center; gap: 12px; }
    .clock { font-size: 28px; line-height: 1; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; min-width: 78px; }
    .live { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .sub { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas { width: 100%; height: 18px; display: block; }
    .row { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    button { height: 28px; border-radius: 8px; border: 1px solid var(--hair); background: var(--btn); color: var(--text); font: 500 12px "Geist", "Segoe UI", sans-serif; cursor: pointer; padding: 0 10px; }
    button:hover { background: var(--btn-2); }
    button.primary { flex: 1; background: var(--primary); color: var(--primary-ink); border-color: transparent; }
    button.primary:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .x { height: 18px; width: 18px; padding: 0; border: none; background: transparent; color: var(--muted); -webkit-app-region: no-drag; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="brand"><svg width="16" height="16" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.55"/><path d="M4.5 16.5c3.5-6 7.5-6 11.5 0s8 6 11.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span id="title">SOVA</span></span>
      <span class="cam"><span class="dot" id="cam-dot"></span><span id="cam-text">Camera on</span>
        <button class="x" id="hide" aria-label="Hide widget for this session" title="Hide for this session">×</button></span>
    </div>
    <div class="mid">
      <span class="clock" id="clock">--:--</span>
      <div class="live">
        <canvas id="trace" width="300" height="48" aria-hidden="true"></canvas>
        <span class="sub" id="sub" aria-live="polite">Waiting for a reading</span>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="reset" aria-label="Quick breathing reset">Breathing reset</button>
      <button id="pause" aria-label="Pause session">Pause</button>
      <button id="open" aria-label="Open SOVA">Open</button>
    </div>
  </div>
  <script src="./widget.js"></script>
</body>
</html>
