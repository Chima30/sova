<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; media-src blob:; img-src 'self' data:; connect-src 'self';">
  <title>SOVA</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <canvas id="splash-lines" aria-hidden="true"></canvas>
    <div class="splash-word">SOVA</div>
    <div class="splash-tag">Stay in focus. Stay in tune.</div>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="assertive"></div>

  <script src="../../dist/renderer.js"></script>
</body>
</html>
